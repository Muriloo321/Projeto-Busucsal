<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Área técnica — BusUCSAL</title>
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/technical.css">
  <script type="module" src="/assets/js/paginas/tecnico.js"></script>
</head>
<body>
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <div class="conteiner topo__barra">
      <a class="marca" href="/tecnico">
        <img src="/assets/img/logo.svg" alt="" width="36" height="36">
        <span class="marca__nome">Bus<span>UCSAL</span></span>
        <span class="marca__area">Área técnica</span>
      </a>
      <nav class="navegacao" aria-label="Páginas">
        <a href="/">Página pública</a>
        <a href="/admin">Painel da equipe</a>
        <button id="botao-sair" class="botao botao--secundario botao--pequeno" type="button" hidden>Sair</button>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="conteiner">
    <div id="raiz"><div class="estado-carregando" role="status">Verificando sua sessão…</div></div>
  </main>

  <footer class="rodape">
    <div class="conteiner rodape__linha">
      <p>Informações internas para desenvolvimento e demonstração técnica. Não compartilhe capturas com dados reais de estudantes.</p>
    </div>
  </footer>
</body>
</html>
